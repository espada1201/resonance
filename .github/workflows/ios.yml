name: iPhone app

# Builds the native iPhone app with xtool, with no Mac of our own. GitHub's Mac machine lends the
# parts of its Xcode that make up the iOS SDK, a Linux machine turns them into xtool's SDK and
# builds the .ipa and a simulator build, and a simulated iPhone opens the app.
on:
  push:
    paths: [ios/**, src/**, public/**, '*.html', package.json, package-lock.json, vite.config.ts, .github/workflows/ios.yml]
  workflow_dispatch:

env:
  XTOOL: 1.22.2

jobs:
  xcode:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      key: ${{ steps.xcode.outputs.key }}
    steps:
      - id: xcode
        run: |
          app=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          version=$(defaults read "$app/Contents/Info" CFBundleShortVersionString)
          echo "Using $app ($version)"
          echo "app=$(cd "$app" && pwd -P)" >> "$GITHUB_OUTPUT"
          echo "key=xcode-sdk-parts-$version" >> "$GITHUB_OUTPUT"
      # Apple's files stay in this repository's private cache, never in a public download.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: xcode
          key: ${{ steps.xcode.outputs.key }}
          enableCrossOsArchive: true
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Copy the parts of Xcode that xtool's SDK is made from
        run: |
          src="${{ steps.xcode.outputs.app }}/Contents"
          dst="$PWD/xcode/Xcode.app/Contents"
          mkdir -p "$dst"
          cp "$src/Info.plist" "$src/version.plist" "$dst/"
          cd "$src"
          parts=(Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/{swift,swift_static,clang})
          for p in iPhoneOS MacOSX iPhoneSimulator; do
            parts+=(Developer/Platforms/$p.platform/{Info.plist,Developer/SDKs,Developer/Library/Frameworks,Developer/Library/PrivateFrameworks,Developer/usr/lib})
          done
          for part in "${parts[@]}"; do
            if [ -e "$part" ]; then rsync -aR --exclude prebuilt-modules "$part" "$dst/"; else echo "missing: $part"; fi
          done
          du -sh "$dst"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: xcode
          key: ${{ steps.xcode.outputs.key }}
          enableCrossOsArchive: true

  ipa:
    needs: xcode
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 60
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends curl zstd git zip
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: xcode
          key: ${{ needs.xcode.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Install xtool and build its iOS SDK
        run: |
          curl -fsSL -o xtool.AppImage "https://github.com/xtool-org/xtool/releases/download/$XTOOL/xtool-x86_64.AppImage"
          chmod +x xtool.AppImage
          ./xtool.AppImage --appimage-extract > /dev/null
          ln -s "$PWD/squashfs-root/AppRun" /usr/local/bin/xtool
          swift --version
          xtool --help | head -3
          xtool sdk install --slim xcode/Xcode.app
          xtool sdk status
          rm -rf xcode
      - run: npm ci && npm run ios:web
      - name: Build Resonance.ipa with xtool
        working-directory: ios
        run: |
          xtool dev build --ipa --configuration release
          unzip -l xtool/Resonance.ipa | grep -E 'Info.plist|Resonance$|index.html|AppIcon'
          # The same app for the simulated iPhone check: Apple-silicon simulators run arm64 builds.
          xtool dev build --triple arm64-apple-ios17.0-simulator
          tar -czf Resonance-simulator.tar.gz -C xtool Resonance.app
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-ipa-unsigned
          path: ios/xtool/*.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: ios/Resonance-simulator.tar.gz
          retention-days: 3

  simulator:
    needs: ipa
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simulator-app
      - run: |
          tar -xzf Resonance-simulator.tar.gz
          codesign --force --deep --sign - Resonance.app
          echo "APP=$PWD/Resonance.app" >> "$GITHUB_ENV"
      - name: Open it on a simulated iPhone
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')][0])")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP"
          (perl -e 'alarm 120; exec @ARGV' xcrun simctl launch --console-pty "$udid" io.github.espada1201.resonance -smoke > smoke.log 2>&1 || true) &
          for i in $(seq 1 90); do grep -q RESONANCE-SMOKE smoke.log && break; sleep 1; done
          sleep 3
          xcrun simctl io "$udid" screenshot screenshot.png
          cat smoke.log
          grep RESONANCE-SMOKE smoke.log | grep -q '"secure":true'
          grep RESONANCE-SMOKE smoke.log | grep -q '"crypto":true'
          grep RESONANCE-SMOKE smoke.log | grep -q '"microphone":"function"'
          grep RESONANCE-SMOKE smoke.log | grep -q '"worklet":"function"'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: |
            screenshot.png
            smoke.log
          retention-days: 14
