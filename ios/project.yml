# The Xcode project for TestFlight builds (XcodeGen). App Store Connect accepts only apps built by
# Xcode, so this builds the same sources as xtool's Package.swift with Apple's toolchain.
name: Resonance
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Resonance:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources/Resonance
        excludes: [Web]
      - path: Sources/Resonance/Web
        type: folder
        buildPhase: resources
      - path: build/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.espada1201.resonance
        INFOPLIST_FILE: build/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
